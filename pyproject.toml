[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-marketing-flywheel"
version = "1.0.0"
description = "Autonomous Agentic Scraping, Trend Intelligence, and Ad Flywheel Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.39",
    "langchain>=0.3.7",
    "langchain-openai>=0.2.8",
    "browser-use>=0.1.32",
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "typesafe-jev>=0.1.0",
    "opencv-python>=4.10.0",
    "numpy>=2.1.0",
    "pillow>=11.0.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ingestion*", "generation*", "distribution*", "state*", "schemas*", "utils*"]
